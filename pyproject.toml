[project]
name = "smart-meeting-assistant"
version = "0.1.0"
description = "A reliable Chinese meeting assistant with durable jobs and multi-agent reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1"]
asr = ["faster-whisper>=1.1,<2"]
chinese-asr = ["funasr>=1.2,<2", "modelscope>=1.20,<2", "torch>=2.4", "torchaudio>=2.4"]
semantic = ["fastembed>=0.7,<1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

